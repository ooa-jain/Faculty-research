{% extends "base.html" %}
{% block title %}FDP Faculty Research & Innovation Survey{% endblock %}

{% block extra_head %}
<!-- Load React -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<!-- Load Babel -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<!-- html2pdf -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<!-- Google Fonts -->
<!-- Google Fonts: EB Garamond (formal serif) + Source Sans 3 (clean sans) -->
<link
  href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Source+Sans+3:wght@400;600;700&family=DM+Mono:wght@400;500;700&display=swap"
  rel="stylesheet">
<style>
  body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background-color: #F0F4F8;
    background-image:
      linear-gradient(rgba(0, 0, 0, 0.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 0, 0, 0.055) 1px, transparent 1px);
    background-size: 40px 40px;
    font-family: 'Source Sans 3', sans-serif;
  }

  .top-bar-container {
    background: #FFFFFF;
    color: #1E293B;
    padding: 0;
    border-bottom: 1px solid #E2E8F0;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
  }

  .top-bar-inner {
    max-width: 100%;
    margin: 0 auto;
    padding: 12px 32px;
    display: flex;
    align-items: center;
    gap: 16px;
    justify-content: flex-start;
  }

  .top-bar-text {
    flex: 1;
    min-width: 0;
  }

  .top-bar-logo {
    max-width: 52px;
    flex-shrink: 0;
  }

  .top-bar-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    border-right: 1px solid #E2E8F0;
    padding-right: 18px;
    margin-right: 4px;
    flex-shrink: 0;
  }

  .top-bar-brand-text {
    display: flex;
    flex-direction: column;
  }

  .top-bar-brand-name {
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 15px;
    font-weight: 700;
    color: #1E293B;
    line-height: 1.1;
  }

  .top-bar-brand-sub {
    font-family: 'DM Mono', monospace;
    font-size: 7.5px;
    letter-spacing: 1px;
    color: #00B4A6;
    text-transform: uppercase;
    margin-top: 2px;
  }

  .top-bar-title {
    font-family: 'EB Garamond', Georgia, serif;
    font-size: clamp(14px, 2.2vw, 20px);
    font-weight: 700;
    line-height: 1.2;
    margin: 0;
    color: #1E293B;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .top-bar-subtitle {
    font-family: 'DM Mono', monospace;
    font-size: 8px;
    letter-spacing: 2.5px;
    color: #00B4A6;
    margin-bottom: 3px;
    text-transform: uppercase;
  }

  .section-tabs {
    display: flex;
    overflow-x: auto;
    border-top: 1px solid #E2E8F0;
    background: #F8FAFC;
    scrollbar-width: none;
  }

  .section-tabs::-webkit-scrollbar {
    display: none;
  }

  .section-tab-btn {
    padding: 9px 14px;
    border: none;
    background: transparent;
    font-family: 'DM Mono', monospace;
    font-size: 8.5px;
    letter-spacing: 0.5px;
    white-space: nowrap;
    text-transform: uppercase;
    transition: all 0.15s;
    flex-shrink: 0;
  }

  @media(max-width: 768px) {
    .top-bar-inner {
      padding: 10px 16px;
      gap: 10px;
    }

    .top-bar-brand {
      padding-right: 12px;
    }

    .top-bar-brand-sub {
      display: none;
    }

    .top-bar-title {
      font-size: 13px;
    }

    .top-bar-logo {
      max-width: 40px;
    }
  }

  @media(max-width: 480px) {
    .top-bar-brand-name {
      font-size: 13px;
    }

    .top-bar-title {
      display: none;
    }
  }
</style>
{% endblock %}

{% block content %}
<div id="root"></div>

{% raw %}
<script type="text/babel">
  const { useState, useEffect } = React;

  // ─── PALETTE ──────────────────────────────────────────────────────────────────
  const C = {
    ink: "#0D1117", ink2: "#161B27", ink3: "#1E2535",
    teal: "#00B4A6", tealLt: "#E0F7F5",
    violet: "#7C3AED", violetLt: "#EDE9FF",
    amber: "#D97706", amberLt: "#FEF3C7",
    coral: "#E05252", coralLt: "#FEE2E2",
    emerald: "#059669", emeraldLt: "#D1FAE5",
    gold: "#F59E0B", slate: "#475569",
    muted: "#94A3B8", border: "#E2E8F0",
    bg: "#F8FAFC", white: "#FFFFFF",
    text: "#1E293B", text2: "#475569",
  };

  const SECTIONS = [
    { id: "consent", label: "Consent & Identity", icon: "◈", color: C.teal },
    { id: "research", label: "Research Profile", icon: "◉", color: C.violet },
    { id: "publication", label: "Publication History", icon: "◎", color: C.amber },
    { id: "innovation", label: "Innovation Projects", icon: "◐", color: C.coral },
    { id: "aitools", label: "AI Tools & Research", icon: "◑", color: C.teal },
    { id: "aipublication", label: "AI for Global Publication", icon: "◆", color: C.emerald },
    { id: "integration", label: "Learning–Research Integration", icon: "◒", color: C.violet },
    { id: "boundaries", label: "Beyond the Classroom", icon: "⬡", color: C.coral },
    { id: "career", label: "Faculty Career Pathways", icon: "◓", color: C.amber },
    { id: "aspirations", label: "Aspirations & Commitments", icon: "★", color: C.teal },
  ];

  function SegmentHeader({ icon, label, color, subtitle, visual }) {
    return (
      <div style={{
        background: `linear-gradient(135deg, ${color}12 0%, ${color}05 100%)`,
        border: `1px solid ${color}30`,
        borderLeft: `5px solid ${color}`,
        borderRadius: "0 12px 12px 0",
        padding: "20px 24px 16px",
        marginBottom: 28,
        position: "relative",
        overflow: "hidden",
      }}>
        <div style={{
          position: "absolute", top: -20, right: -20,
          width: 140, height: 140,
          borderRadius: "50%",
          background: `radial-gradient(circle, ${color}15 0%, transparent 70%)`,
          pointerEvents: "none",
        }} />
        <div style={{ display: "flex", alignItems: "flex-start", gap: 14, position: "relative" }}>
          <div style={{
            width: 44, height: 44, borderRadius: 10,
            background: `linear-gradient(135deg, ${color} 0%, ${color}CC 100%)`,
            display: "flex", alignItems: "center", justifyContent: "center",
            fontSize: 20, color: "#fff", flexShrink: 0,
            boxShadow: `0 4px 12px ${color}40`,
          }}>{icon}</div>
          <div style={{ flex: 1 }}>
            <div style={{ fontFamily: "'DM Mono',monospace", fontSize: 10, letterSpacing: 3, color, textTransform: "uppercase", marginBottom: 4, fontWeight: 600 }}>
              Survey Section
            </div>
            <div style={{ fontFamily: "'Playfair Display',Georgia,serif", fontSize: 20, fontWeight: 700, color: C.text, lineHeight: 1.2 }}>
              {label}
            </div>
            {subtitle && (
              <div style={{ fontFamily: "'Lora',Georgia,serif", fontSize: 13, color: C.text2, marginTop: 5, lineHeight: 1.5, fontStyle: "italic" }}>
                {subtitle}
              </div>
            )}
          </div>
        </div>
        {visual && (
          <div style={{ marginTop: 16, paddingTop: 14, borderTop: `1px solid ${color}20` }}>
            {visual}
          </div>
        )}
      </div>
    );
  }

  function Divider({ color = C.teal, label }) {
    return (
      <div style={{ display: "flex", alignItems: "center", gap: 12, margin: "24px 0 20px" }}>
        <div style={{ flex: 1, height: 1, background: `linear-gradient(90deg, ${color}60, transparent)` }} />
        {label && (
          <span style={{ fontFamily: "'DM Mono',monospace", fontSize: 9, color, letterSpacing: 2, textTransform: "uppercase", whiteSpace: "nowrap" }}>
            {label}
          </span>
        )}
        <div style={{ flex: 1, height: 1, background: `linear-gradient(270deg, ${color}60, transparent)` }} />
      </div>
    );
  }

  function ScaleVisual({ value, onChange, low, high, color, max = 5 }) {
    return (
      <div style={{ margin: "8px 0" }}>
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
          {Array.from({ length: max }, (_, i) => i + 1).map(n => (
            <button key={n} onClick={() => onChange(n)}
              style={{
                width: 46, height: 46, border: `2px solid ${value === n ? color : C.border}`,
                background: value === n ? `linear-gradient(135deg, ${color}, ${color}CC)` : C.white,
                color: value === n ? "#fff" : C.slate,
                borderRadius: 10, cursor: "pointer",
                fontFamily: "'DM Mono',monospace", fontWeight: 700, fontSize: 15,
                transition: "all 0.18s", boxShadow: value === n ? `0 4px 12px ${color}40` : "none",
                transform: value === n ? "scale(1.1)" : "scale(1)",
              }}>{n}</button>
          ))}
        </div>
        <div style={{
          display: "flex", justifyContent: "space-between", marginTop: 6,
          fontFamily: "'DM Mono',monospace", fontSize: 10, color: C.muted, letterSpacing: 0.5
        }}>
          <span>1 — {low}</span><span>{max} — {high}</span>
        </div>
      </div>
    );
  }

  function CheckGroup({ options, selected = [], onChange, cols = 2, color = C.teal }) {
    const toggle = v => {
      const s = selected.includes(v) ? selected.filter(x => x !== v) : [...selected, v];
      onChange(s);
    };
    return (
      <div style={{ display: "grid", gridTemplateColumns: `repeat(${cols},1fr)`, gap: "6px 12px", margin: "8px 0" }}>
        {options.map(opt => (
          <label key={opt} style={{
            display: "flex", alignItems: "center", gap: 8, cursor: "pointer",
            fontSize: 13, color: C.text2, padding: "8px 10px",
            border: `1.5px solid ${selected.includes(opt) ? color : C.border}`,
            background: selected.includes(opt) ? color + "12" : C.white,
            borderRadius: 8, transition: "all 0.15s",
          }}>
            <input type="checkbox" checked={selected.includes(opt)} onChange={() => toggle(opt)} style={{ accentColor: color, width: 15, height: 15 }} />
            <span>{opt}</span>
          </label>
        ))}
      </div>
    );
  }

  function RadioGroup({ options, value, onChange, color = C.teal }) {
    return (
      <div style={{ display: "flex", flexDirection: "column", gap: 6, margin: "8px 0" }}>
        {options.map(opt => (
          <label key={opt} style={{
            display: "flex", alignItems: "center", gap: 10, cursor: "pointer",
            fontSize: 13, color: C.text2, padding: "9px 12px",
            border: `1.5px solid ${value === opt ? color : C.border}`,
            background: value === opt ? color + "10" : C.white,
            borderRadius: 8, transition: "all 0.15s",
          }}>
            <input type="radio" checked={value === opt} onChange={() => onChange(opt)} style={{ accentColor: color }} />
            <span>{opt}</span>
          </label>
        ))}
      </div>
    );
  }

  function Field({ label, hint, required, children, color = C.teal }) {
    return (
      <div style={{ marginBottom: 22 }}>
        <div style={{ fontFamily: "'Lora',Georgia,serif", fontWeight: 600, fontSize: 14, color: C.text, marginBottom: 3 }}>
          {label} {required && <span style={{ color: C.coral, fontSize: 11 }}>*</span>}
        </div>
        {hint && <div style={{ fontFamily: "'DM Mono',monospace", fontSize: 10.5, color: C.muted, marginBottom: 7, letterSpacing: 0.5, lineHeight: 1.5 }}>{hint}</div>}
        {children}
      </div>
    );
  }

  function Input({ value, onChange, placeholder, type = "text" }) {
    return (
      <input type={type} value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder}
        style={{
          width: "100%", padding: "10px 14px", border: `1.5px solid ${C.border}`,
          borderRadius: 8, fontFamily: "'Lora',Georgia,serif", fontSize: 13, color: C.text,
          background: C.white, outline: "none", boxSizing: "border-box",
          transition: "border-color 0.2s"
        }}
        onFocus={e => e.target.style.borderColor = C.teal}
        onBlur={e => e.target.style.borderColor = C.border}
      />
    );
  }

  function Textarea({ value, onChange, placeholder, rows = 3 }) {
    return (
      <textarea value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder} rows={rows}
        style={{
          width: "100%", padding: "10px 14px", border: `1.5px solid ${C.border}`,
          borderRadius: 8, fontFamily: "'Lora',Georgia,serif", fontSize: 13, color: C.text,
          background: C.white, outline: "none", resize: "vertical", boxSizing: "border-box",
          transition: "border-color 0.2s"
        }}
        onFocus={e => e.target.style.borderColor = C.teal}
        onBlur={e => e.target.style.borderColor = C.border}
      />
    );
  }

  function Select({ value, onChange, options, placeholder }) {
    return (
      <select value={value} onChange={e => onChange(e.target.value)}
        style={{
          width: "100%", padding: "10px 14px", border: `1.5px solid ${C.border}`,
          borderRadius: 8, fontFamily: "'Lora',Georgia,serif", fontSize: 13,
          color: value ? C.text : C.muted, background: C.white, outline: "none"
        }}>
        <option value="">{placeholder || "Select..."}</option>
        {options.map(o => <option key={o} value={o}>{o}</option>)}
      </select>
    );
  }

  function PathwayCard({ title, icon, desc, color, selected, onClick }) {
    return (
      <div onClick={onClick} style={{
        border: `2px solid ${selected ? color : C.border}`,
        background: selected ? color + "10" : C.white,
        borderRadius: 12, padding: "16px 14px", cursor: "pointer",
        transition: "all 0.2s",
        boxShadow: selected ? `0 4px 16px ${color}30` : "0 1px 4px rgba(0,0,0,0.05)",
        transform: selected ? "translateY(-2px)" : "none",
      }}>
        <div style={{ fontSize: 26, marginBottom: 8 }}>{icon}</div>
        <div style={{ fontFamily: "'Lora',Georgia,serif", fontWeight: 700, fontSize: 13, color: selected ? color : C.text, marginBottom: 5 }}>{title}</div>
        <div style={{ fontFamily: "'DM Mono',monospace", fontSize: 10, color: C.muted, lineHeight: 1.5 }}>{desc}</div>
      </div>
    );
  }

  function ProgressBar({ current, total }) {
    const pct = Math.round(((current + 1) / total) * 100);
    const color = SECTIONS[current]?.color || C.teal;
    return (
      <div style={{ position: "relative" }}>
        <div style={{ height: 4, background: "#E2E8F0", borderRadius: 2 }}>
          <div style={{
            height: "100%", borderRadius: 2, width: `${pct}%`,
            background: `linear-gradient(90deg, ${C.teal}, ${color})`,
            transition: "width 0.4s ease",
          }} />
        </div>
        <div style={{
          display: "flex", justifyContent: "space-between", marginTop: 4,
          fontFamily: "'DM Mono',monospace", fontSize: 9, color: C.muted, letterSpacing: 0.5
        }}>
          <span>Section {current + 1} of {total}</span>
          <span>{pct}% complete</span>
        </div>
      </div>
    );
  }

  const init = {
    consent: { agreed: "", anonymous: true },
    identity: { name: "", institution: "", department: "", designation: "", yearsExp: "", email: "", orcid: "" },
    research: { domain: "", subDomain: "", keywords: "", approaches: [], paradigm: "", focus: "", collabTypes: [], funding: "" },
    publication: { total: "", indexed: "", hIndex: "", citations: "", journalTypes: [], lastYear: "", conferences: "", patents: "", openAccess: "", biggestChallenge: "" },
    innovation: { hasProject: "", projectDesc: "", stage: "", startup: "", industry: "", barriers: [], valueApproach: "", ipAwareness: "" },
    aitools: { overallComfort: 0, toolsUsed: [], usageContexts: [], researchUse: "", teachingUse: "", concerns: [], opportunityRating: 0, wantToLearn: "" },
    aipublication: {
      aiWritingComfort: 0, aiLitReviewUse: "", aiJournalMatch: "", aiEthicsStance: "",
      aiCoAuthorView: "", aiResearchGaps: "", aiDataAnalysis: "", globalCollabInterest: "",
      openAccessAwareness: "", preregistrationAwareness: "", altmetricsAwareness: "",
      aiPublicationBarriers: [], aiPublicationOpportunities: [],
      publishingAmbition: "", scopusWosTarget: "",
    },
    integration: {
      integrationLevel: 0, integrationMethods: [], mainChallenge: "",
      notionalHoursAwareness: "", notionalHoursUse: "",
      experientialLearningMethods: [], experientialLearningRating: 0,
      learningOutcomesApproach: "",
      researchAsLearningView: "", studentResearchInvolvement: "",
      assessmentResearchLink: "", deepReadingHabit: "", knowledgeCuration: "",
      fdpExpectation: "",
    },
    boundaries: {
      beyondClassroomActivities: [], studentInnovationSupport: "",
      startupEcosystemRole: "", incubatorLink: "",
      industryExposureActivities: [], studentEntrepreneurship: "",
      solutionProviderApproach: "", communityEngagement: "",
      fdpInterestedInJoining: "", fdpTopicsInterested: [],
      policyEngagement: "", sdgAlignment: [],
    },
    career: {
      currentRole: "", primaryIdentity: [],
      futurePathway: "", timelineAspiration: "",
      administratorInterest: "", teacherDeveloperInterest: "",
      researcherGoals: "", entrepreneurInterest: "",
      skillGaps: [], upskillPriorities: [],
      mentoringRole: "", leadershipAspiration: "",
      internationalAspiration: "", collaborationNeeds: "",
      careerObstacles: [], supportNeeded: [],
      fiveYearVision: "",
    },
    aspirations: { oneYearGoal: "", innovationIdea: "", collaborationInterest: "", commitmentAction: "", additionalThoughts: "" },
  };

  function FDPForm() {
    const [section, setSection] = useState(0);
    const [data, setData] = useState(init);
    const [submitted, setSubmitted] = useState(false);
    const [hasStarted, setHasStarted] = useState(false);

    const upd = (block, field, val) => setData(d => ({ ...d, [block]: { ...d[block], [field]: val } }));
    const sid = SECTIONS[section].id;
    const col = SECTIONS[section].color;

    const handleSubmit = async () => {
      // ── Comprehensive validation ──────────────────────────────────────────
      const err = (msg, sec) => { alert(msg); setSection(sec); return false; };

      // Section 0 — Consent & Identity
      if (!data.consent.agreed || data.consent.agreed.startsWith("No"))
        return err("Please give your consent to participate (Section 1).", 0);
      if (!data.identity.name.trim())
        return err("Full Name is required (Section 1).", 0);
      if (!data.identity.email.trim())
        return err("Email Address is required (Section 1).", 0);
      if (!data.identity.institution.trim())
        return err("Institution / University is required (Section 1).", 0);
      if (!data.identity.department.trim())
        return err("Department / School is required (Section 1).", 0);
      if (!data.identity.designation)
        return err("Designation is required (Section 1).", 0);
      if (!data.identity.yearsExp)
        return err("Years of Experience is required (Section 1).", 0);

      // Section 1 — Research Profile
      if (!data.research.domain.trim())
        return err("Primary Research Domain is required (Section 2).", 1);
      if (!data.research.subDomain.trim())
        return err("Sub-Domain / Specialisation is required (Section 2).", 1);
      if (!data.research.keywords.trim())
        return err("Research Keywords are required (Section 2).", 1);
      if (!data.research.approaches.length)
        return err("Please select at least one Research Approach (Section 2).", 1);
      if (!data.research.paradigm)
        return err("Research Paradigm is required (Section 2).", 1);
      if (!data.research.focus.trim())
        return err("Current Research Focus is required (Section 2).", 1);
      if (!data.research.collabTypes.length)
        return err("Please select a Collaboration Pattern (Section 2).", 1);
      if (!data.research.funding)
        return err("Funding Status is required (Section 2).", 1);

      // Section 2 — Publication History
      if (!data.publication.total)
        return err("Total Publications is required (Section 3).", 2);
      if (!data.publication.indexed)
        return err("Scopus / WoS Indexed Papers is required (Section 3).", 2);
      if (!data.publication.hIndex)
        return err("h-Index is required (Section 3).", 2);
      if (!data.publication.citations)
        return err("Total Citations is required (Section 3).", 2);
      if (!data.publication.lastYear)
        return err("Year of most recent publication is required (Section 3).", 2);
      if (!data.publication.patents)
        return err("Patents field is required (Section 3).", 2);
      if (!data.publication.journalTypes.length)
        return err("Please select at least one Publication Venue type (Section 3).", 2);
      if (!data.publication.biggestChallenge.trim())
        return err("Biggest challenge in publishing is required (Section 3).", 2);

      // Section 3 — Innovation
      if (!data.innovation.hasProject)
        return err("Innovation Project status is required (Section 4).", 3);
      if (!data.innovation.barriers.length)
        return err("Please select at least one Innovation Barrier (Section 4).", 3);
      if (!data.innovation.industry)
        return err("Industry Collaboration experience is required (Section 4).", 3);
      if (!data.innovation.ipAwareness)
        return err("IP Awareness is required (Section 4).", 3);

      // Section 4 — AI Tools
      if (!data.aitools.overallComfort)
        return err("Please rate your AI Comfort level (Section 5).", 4);
      if (!data.aitools.toolsUsed.length)
        return err("Please select at least one AI Tool (Section 5).", 4);
      if (!data.aitools.usageContexts.length)
        return err("Please select at least one AI Usage Context (Section 5).", 4);
      if (!data.aitools.researchUse.trim())
        return err("AI use in research is required (Section 5).", 4);
      if (!data.aitools.teachingUse.trim())
        return err("AI use in teaching is required (Section 5).", 4);
      if (!data.aitools.concerns.length)
        return err("Please select at least one AI Concern (Section 5).", 4);
      if (!data.aitools.opportunityRating)
        return err("Please rate the AI Opportunity for your domain (Section 5).", 4);

      // Section 5 — AI for Global Publication
      if (!data.aipublication.aiLitReviewUse)
        return err("AI Literature Review usage is required (Section 6).", 5);
      if (!data.aipublication.aiJournalMatch)
        return err("AI Journal Matching field is required (Section 6).", 5);
      if (!data.aipublication.aiDataAnalysis)
        return err("AI Data Analysis field is required (Section 6).", 5);
      if (!data.aipublication.aiCoAuthorView)
        return err("AI Co-author View is required (Section 6).", 5);
      if (!data.aipublication.aiEthicsStance)
        return err("AI Ethics Stance is required (Section 6).", 5);
      if (!data.aipublication.openAccessAwareness)
        return err("Open Access Awareness is required (Section 6).", 5);
      if (!data.aipublication.preregistrationAwareness)
        return err("Pre-registration Awareness is required (Section 6).", 5);
      if (!data.aipublication.altmetricsAwareness)
        return err("Altmetrics Awareness is required (Section 6).", 5);
      if (!data.aipublication.globalCollabInterest)
        return err("Global Collaboration Interest is required (Section 6).", 5);
      if (!data.aipublication.aiPublicationBarriers.length)
        return err("Please select at least one Publication Barrier (Section 6).", 5);
      if (!data.aipublication.aiPublicationOpportunities.length)
        return err("Please select where AI can help your publication journey (Section 6).", 5);
      if (!data.aipublication.publishingAmbition.trim())
        return err("Your 3-year Publishing Ambition is required (Section 6).", 5);

      // Section 6 — Learning–Research Integration
      if (!data.integration.integrationLevel)
        return err("Please rate your Teaching–Research Integration level (Section 7).", 6);
      if (!data.integration.integrationMethods.length)

      let html = `<h1 style="color:#00B4A6;margin-bottom:10px;">FDP Research Survey</h1>`;
      html += `<p style="color:#475569;margin-bottom:30px;">Submitted Responses</p>`;

      const printBlock = (title, block) => {
        html += `<div style="margin-bottom:20px;padding:20px;background:#F8FAFC;border-radius:8px;page-break-inside:avoid;">`;
        html += `<h3 style="color:#7C3AED;margin-top:0;margin-bottom:15px;border-bottom:1px solid #E2E8F0;padding-bottom:10px;">${title}</h3>`;
        for (let key in block) {
          let val = block[key];
          if (Array.isArray(val)) val = val.join(', ');
          if (typeof val === 'boolean') val = val ? 'Yes' : 'No';
          if (!val) val = '—';
          html += `<div style="margin-bottom:8px;"><strong>${key}:</strong> <span style="color:#475569;">${val}</span></div>`;
        }
        html += `</div>`;
      };

      printBlock('Consent', data.consent);
      printBlock('Identity', data.identity);
      printBlock('Research Profile', data.research);
      printBlock('Publication History', data.publication);
      printBlock('Innovation', data.innovation);
      printBlock('AI Tools', data.aitools);
      printBlock('AI for Global Publication', data.aipublication);
      printBlock('Learning–Research Integration', data.integration);
      printBlock('Beyond the Classroom', data.boundaries);
      printBlock('Faculty Career Pathways', data.career);
      printBlock('Aspirations', data.aspirations);

      el.innerHTML = html;

        margin: 0.5,
        filename: 'FDP_Survey_Responses.pdf',
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2 },
        jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
      };

        <Field label="Your 3-year publication ambition" required color={C.emerald}>
          <Textarea value={data.aipublication.publishingAmbition} onChange={v => upd("aipublication", "publishingAmbition", v)} rows={2} placeholder="e.g. Publish 3 Q1 papers, one review article in a high-IF journal, first international collaboration..." />
        </Field>
      </>);

      if (sid === "integration") return (<>
        <SegmentHeader icon="◒" label="Learning–Research Integration" color={C.violet}
          subtitle="Research as a learning experience — where students don't just study research, they do research. This section explores your pedagogical philosophy and practice."
          visual={
            <div style={{ display: "flex", gap: 0, overflow: "hidden", borderRadius: 8 }}>
              {["Surface Learning", "Deep Learning", "Research Learning", "Innovation Learning"].map((l, i) => {
                const cols = [C.muted, C.violet + "99", C.violet, C.amber];
                return (
                  <div key={l} style={{ flex: 1, background: cols[i], padding: "8px 6px", textAlign: "center" }}>
                    <div style={{ fontFamily: "'DM Mono',monospace", fontSize: 8, color: "#fff", lineHeight: 1.3 }}>{l}</div>
                  </div>
                );
              })}
            </div>
          }
        />
        <Divider color={C.violet} label="Teaching-Research Integration Level" />
        <Field label="Current level of teaching–research integration in your practice" hint="1 = Completely separate · 5 = Fully integrated — I teach what I research" required color={C.violet}>
          <ScaleVisual value={data.integration.integrationLevel} onChange={v => upd("integration", "integrationLevel", v)} low="Fully separate" high="Fully integrated" color={C.violet} />
        </Field>
        <Field label="How do you currently integrate research into teaching?" required color={C.violet}>
          <CheckGroup color={C.violet} options={["Assign research papers to students", "Student research projects", "Cite own research in lectures", "Problem-based learning from research", "Live lab demonstrations", "Research-informed curriculum design", "Co-authoring with students", "None currently"]} selected={data.integration.integrationMethods} onChange={v => upd("integration", "integrationMethods", v)} />
        </Field>
        <Divider color={C.violet} label="Notional Learning Hours" />
        <div style={{ background: C.violetLt, borderRadius: 10, padding: "14px 16px", marginBottom: 18 }}>
          <div style={{ fontFamily: "'DM Mono',monospace", fontSize: 10, color: C.violet, fontWeight: 700, marginBottom: 6 }}>WHAT ARE NOTIONAL LEARNING HOURS?</div>
          <div style={{ fontFamily: "'Lora',Georgia,serif", fontSize: 13, color: C.text2, lineHeight: 1.6 }}>
            Notional learning hours represent the total time a student is expected to spend on learning — including contact hours, self-study, assignments, practicals, and research. They form the basis of credit frameworks (NBA, NEP 2020) and help align learning with research outcomes.
          </div>
        </div>
        <Field label="Awareness of notional learning hours framework in curriculum design" required color={C.violet}>
          <RadioGroup color={C.violet} options={["Very aware — I design curricula around notional hours", "Aware — I apply it occasionally", "I have heard of it but don't apply it", "Not aware of the concept", "My institution uses it but I don't engage with it"]} value={data.integration.notionalHoursAwareness} onChange={v => upd("integration", "notionalHoursAwareness", v)} />
        </Field>
        <Field label="How do you currently use notional hours to embed research into learning?" required color={C.violet}>
          <RadioGroup color={C.violet} options={["I allocate notional hours for student research components", "I embed self-directed inquiry within notional hour budgets", "I link research project hours to credit allocation", "I haven't used notional hours for research embedding", "I would like to learn how"]} value={data.integration.notionalHoursUse} onChange={v => upd("integration", "notionalHoursUse", v)} />
        </Field>
        <Divider color={C.violet} label="Experiential Learning Methods" />
        <div style={{ background: C.violetLt, borderRadius: 10, padding: "14px 16px", marginBottom: 18 }}>
          <div style={{ fontFamily: "'DM Mono',monospace", fontSize: 10, color: C.violet, fontWeight: 700, marginBottom: 8 }}>EXPERIENTIAL LEARNING SPECTRUM</div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 8 }}>
            {[{ method: "Problem-Based Learning", icon: "🔧" }, { method: "Project-Based Learning", icon: "📁" }, { method: "Case-Based Learning", icon: "📋" }, { method: "Design Thinking", icon: "💡" }, { method: "Flipped Classroom", icon: "🔄" }, { method: "Simulation & Role-Play", icon: "🎭" }, { method: "Community Engagement", icon: "🌱" }, { method: "Research Apprenticeship", icon: "🔬" }].map(m => (
              <div key={m.method} style={{ background: C.white, borderRadius: 8, padding: "8px", textAlign: "center", border: `1px solid ${C.violet}30` }}>
                <div style={{ fontSize: 16, marginBottom: 3 }}>{m.icon}</div>
                <div style={{ fontFamily: "'DM Mono',monospace", fontSize: 8, color: C.violet, lineHeight: 1.3 }}>{m.method}</div>
              </div>
            ))}
          </div>
        </div>
        <Field label="Experiential learning methods you actively use" required color={C.violet}>
          <CheckGroup color={C.violet} options={["Problem-Based Learning (PBL)", "Project-Based Learning", "Case-Based Learning", "Design Thinking workshops", "Flipped Classroom", "Simulation / Role-Play", "Service learning / Community engagement", "Research apprenticeship / Mentored inquiry", "Inquiry-based learning", "Studio / Maker-based learning"]} selected={data.integration.experientialLearningMethods} onChange={v => upd("integration", "experientialLearningMethods", v)} />
        </Field>
        <Field label="How effective do you find experiential learning for research skill development?" required hint="1 = Not effective · 5 = Highly effective" color={C.violet}>
          <ScaleVisual value={data.integration.experientialLearningRating} onChange={v => upd("integration", "experientialLearningRating", v)} low="Not effective" high="Highly effective" color={C.violet} />
        </Field>
        <Divider color={C.violet} label="Research as Real Learning" />
        <Field label="Do you consider research participation a form of deep learning for students?" required color={C.violet}>
          <RadioGroup color={C.violet} options={["Strongly yes — research IS the highest form of learning", "Yes — but only for advanced students", "Partially — it depends on the research type", "Not in my current teaching philosophy", "I haven't considered this explicitly"]} value={data.integration.researchAsLearningView} onChange={v => upd("integration", "researchAsLearningView", v)} />
        </Field>
        <Field label="How do your assessment practices connect to research skills?" required color={C.violet}>
          <RadioGroup color={C.violet} options={["Assessments explicitly test research skills (analysis, synthesis, inquiry)", "Some assessments embed research tasks", "Mostly exam-based with little research component", "I would like to redesign assessments with research-inquiry elements", "Not applicable to my discipline"]} value={data.integration.assessmentResearchLink} onChange={v => upd("integration", "assessmentResearchLink", v)} />
        </Field>
        <Field label="What is your biggest challenge in integrating teaching with research?" required color={C.violet}>
          <Textarea value={data.integration.mainChallenge} onChange={v => upd("integration", "mainChallenge", v)} rows={3} placeholder="e.g. Time, curriculum rigidity, student readiness, appraisal systems..." />
        </Field>
      </>);

      if (sid === "boundaries") return (<>
        <SegmentHeader icon="⬡" label="Beyond the Classroom — Students as Solution Providers" color={C.coral}
          subtitle="The next frontier: classrooms that produce innovators, entrepreneurs and change-makers. Tell us about your role in this transformation."
          visual={
            <div style={{ display: "flex", gap: 0, alignItems: "center", justifyContent: "center", padding: "4px 0" }}>
              {[{ label: "Student", icon: "👨‍🎓" }, { label: "Learner", icon: "📚" }, { label: "Researcher", icon: "🔬" }, { label: "Innovator", icon: "💡" }, { label: "Entrepreneur", icon: "🚀" }].map((s, i) => (
                <div key={s.label} style={{ display: "flex", alignItems: "center" }}>
                  <div style={{ textAlign: "center", width: 72 }}>
                    <div style={{ fontSize: 22 }}>{s.icon}</div>
                    <div style={{ fontFamily: "'DM Mono',monospace", fontSize: 8, color: i === 4 ? C.coral : C.muted, marginTop: 3, fontWeight: i === 4 ? "bold" : "normal" }}>{s.label}</div>
                  </div>
                  {i < 4 && <div style={{ fontSize: 14, color: C.coral, opacity: 0.5, margin: "0 4px" }}>→</div>}
                </div>
              ))}
            </div>
          }
        />
        <Divider color={C.coral} label="Current Beyond-Classroom Activities" />
        <Field label="Activities you currently facilitate beyond the classroom" required color={C.coral}>
          <CheckGroup color={C.coral} options={["Student research projects (published/submitted)", "Hackathons or innovation challenges", "Industry-student collaborative projects", "Student startups mentored", "Social innovation projects", "Patent filings with students", "Product prototype development", "Community-based problem-solving projects", "None currently"]} selected={data.boundaries.beyondClassroomActivities} onChange={v => upd("boundaries", "beyondClassroomActivities", v)} />
        </Field>
        <Field label="How do you support student innovation and entrepreneurship?" required color={C.coral}>
          <RadioGroup color={C.coral} options={["I actively mentor student startups / venture ideas", "I connect students to incubators and seed funding", "I integrate entrepreneurship thinking into regular teaching", "I encourage students to identify real-world problems in coursework", "I have not yet engaged with this area", "I would like to start but need guidance"]} value={data.boundaries.studentInnovationSupport} onChange={v => upd("boundaries", "studentInnovationSupport", v)} />
        </Field>
        <Divider color={C.coral} label="Ecosystem & Industry Links" />
        <Field label="Your role in the startup / innovation ecosystem at your institution" required color={C.coral}>
          <RadioGroup color={C.coral} options={["Faculty in Residence at incubator", "Mentor to student startups", "Industry liaison for student projects", "Advisory board of startup", "No formal role — ad hoc involvement", "No current role", "Would like a role"]} value={data.boundaries.startupEcosystemRole} onChange={v => upd("boundaries", "startupEcosystemRole", v)} />
        </Field>
        <Field label="Industry exposure activities you facilitate for students" required color={C.coral}>
          <CheckGroup color={C.coral} options={["Industry visits / immersion trips", "Guest lectures from practitioners", "Industry-sponsored capstone projects", "Live client briefs in coursework", "Internships with research link", "Co-working / co-creation sessions with industry", "None"]} selected={data.boundaries.industryExposureActivities} onChange={v => upd("boundaries", "industryExposureActivities", v)} />
        </Field>
        <Field label="Do your students engage with UN Sustainable Development Goals (SDGs) in coursework?" required color={C.coral}>
          <CheckGroup color={C.coral} cols={3} options={["SDG 1: No Poverty", "SDG 3: Good Health", "SDG 4: Quality Education", "SDG 7: Clean Energy", "SDG 9: Industry & Innovation", "SDG 11: Sustainable Cities", "SDG 13: Climate Action", "SDG 17: Partnerships", "Not explicitly linked to SDGs"]} selected={data.boundaries.sdgAlignment} onChange={v => upd("boundaries", "sdgAlignment", v)} />
        </Field>
        <Divider color={C.coral} label="FDP Interest & Participation" />
        <div style={{ background: C.coralLt, borderRadius: 10, padding: "14px 16px", marginBottom: 18, border: `1px solid ${C.coral}30` }}>
          <div style={{ fontFamily: "'DM Mono',monospace", fontSize: 10, color: C.coral, fontWeight: 700, marginBottom: 6 }}>FUTURE FDP PROGRAMMES</div>
          <div style={{ fontFamily: "'Lora',Georgia,serif", fontSize: 13, color: C.text2, lineHeight: 1.6 }}>
            We are designing a series of FDP programmes on Research-Innovation-Entrepreneurship integration. Your interest helps us prioritise topics and formats.
          </div>
        </div>
        <Field label="Would you be interested in participating in future FDP sessions on these themes?" required color={C.coral}>
          <RadioGroup color={C.coral} options={["Yes — highly interested, please notify me", "Yes — interested if the topic is relevant", "Maybe — depends on time commitment", "Unlikely, but open to short sessions", "No"]} value={data.boundaries.fdpInterestedInJoining} onChange={v => upd("boundaries", "fdpInterestedInJoining", v)} />
        </Field>
        <Field label="FDP topics you would most benefit from" required color={C.coral}>
          <CheckGroup color={C.coral} options={["Research-to-startup: IP to market", "Design thinking for educators", "Student innovation programme design", "Research paper writing with AI tools", "Grant writing and funding acquisition", "Incubator model for academic institutions", "Transdisciplinary curriculum design", "Evidence-based teaching practices", "SDG-aligned research projects", "International research collaboration"]} selected={data.boundaries.fdpTopicsInterested} onChange={v => upd("boundaries", "fdpTopicsInterested", v)} />
        </Field>
        <Field label="Are you engaged in any policy, advocacy or public engagement related to your research?" required color={C.coral}>
          <RadioGroup color={C.coral} options={["Yes — active policy engagement", "Yes — invited expert occasionally", "I write for public / popular science audiences", "I would like to but haven't started", "No"]} value={data.boundaries.policyEngagement} onChange={v => upd("boundaries", "policyEngagement", v)} />
        </Field>
      </>);

      if (sid === "career") return (<>
        <SegmentHeader icon="◓" label="Faculty Career Pathways — Aspirations & Future Positioning" color={C.amber}
          subtitle="This section helps us understand where you want to go — so we can design support that is truly aligned to your ambitions, not just institutional requirements."
          visual={
            <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 10 }}>
              {[
                { role: "Administrator", icon: "🏛️", desc: "Policy · Leadership · Governance", col: C.amber },
                { role: "Teacher", icon: "📖", desc: "Pedagogy · Curriculum · Mentoring", col: C.violet },
                { role: "Researcher", icon: "🔬", desc: "Discovery · Publication · Grants", col: C.teal },
                { role: "Entrepreneur", icon: "🚀", desc: "Startup · IP · Industry · Impact", col: C.coral },
              ].map(r => (
                <div key={r.role} style={{ background: r.col + "12", borderRadius: 10, padding: "12px 10px", textAlign: "center", border: `1px solid ${r.col}30` }}>
                  <div style={{ fontSize: 22, marginBottom: 5 }}>{r.icon}</div>
                  <div style={{ fontFamily: "'Lora',Georgia,serif", fontWeight: 700, fontSize: 11, color: r.col, marginBottom: 3 }}>{r.role}</div>
                  <div style={{ fontFamily: "'DM Mono',monospace", fontSize: 8, color: C.muted, lineHeight: 1.4 }}>{r.desc}</div>
                </div>

            </div>
          }

        <Divider color={C.amber} label="Current Identity & Primary Role" />
        <Field label="Which roles best describe your current academic identity?" hint="Select all that apply — your primary and secondary identities" required color={C.amber}>

        </Field>
        <Field label="Your current primary role (formal designation function)" required color={C.amber}>
          <RadioGroup color={C.amber} options={["Teaching-focused (minimal research expected)", "Research-focused (teaching is secondary)", "Equal teaching and research responsibilities", "Administrative with teaching/research load", "Industry-sponsored / practitioner role"]} value={data.career.currentRole} onChange={v => upd("career", "currentRole", v)} />

        <Divider color={C.amber} label="Future Pathway Aspirations" />
        <div style={{ marginBottom: 18 }}>
          <div style={{ fontFamily: "'Lora',Georgia,serif", fontWeight: 600, fontSize: 14, color: C.text, marginBottom: 12 }}>Where do you see yourself in 5–7 years? <span style={{ color: C.coral }}>*</span></div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 10 }}>
            {[
              { id: "admin", title: "Academic Administrator", icon: "🏛️", desc: "HOD · Dean · VC · Policy leader", col: C.amber },
              { id: "teacher", title: "Scholar-Educator", icon: "📖", desc: "Master teacher · Curriculum innovator · Pedagogy researcher", col: C.violet },
              { id: "researcher", title: "Research Scholar", icon: "🔬", desc: "Principal Investigator · Grant leader · Global collaborator", col: C.teal },
              { id: "entrepreneur", title: "Academic Entrepreneur", icon: "🚀", desc: "Startup founder · IP commercialiser · Industry partner", col: C.coral },
            ].map(p => (
              <PathwayCard key={p.id} title={p.title} icon={p.icon} desc={p.desc} color={p.col}
                selected={data.career.futurePathway === p.id}
                onClick={() => upd("career", "futurePathway", p.id)} />
            ))}
          </div>
        </div>
        <Field label="Specific aspiration in your chosen pathway" hint="What does success look like for you in 5–7 years? Be concrete." required color={C.amber}>
          <Textarea value={data.career.fiveYearVision} onChange={v => upd("career", "fiveYearVision", v)} rows={3} placeholder="e.g. Lead a funded research centre with 5 PhD students, publish in top-10 journals, file 2 patents..." />
        </Field>
        <Field label="Timeline for your most important career milestone" required color={C.amber}>
          <RadioGroup color={C.amber} options={["Within 1 year", "1–2 years", "3–5 years", "5–10 years", "Beyond 10 years", "Unclear"]} value={data.career.timelineAspiration} onChange={v => upd("career", "timelineAspiration", v)} />
        </Field>
        <Divider color={C.amber} label="Skills, Gaps & Upskilling" />
        <Field label="Skills gaps you need to address to reach your pathway" required color={C.amber}>
          <CheckGroup color={C.amber} options={["Research methodology", "Grant writing", "Academic writing quality", "Data analysis & statistics", "AI tools proficiency", "Leadership & management", "Entrepreneurship & commercialisation", "International collaboration", "Digital pedagogy", "Teaching effectiveness", "Policy & governance", "Industry networking", "IP / Patent management"]} selected={data.career.skillGaps} onChange={v => upd("career", "skillGaps", v)} />
        </Field>
        <Field label="Top 3 upskilling priorities for the next 12 months" required hint="Which of the above will you actively pursue first?" color={C.amber}>
          <Textarea value={data.career.upskillPriorities} onChange={v => upd("career", "upskillPriorities", v)} rows={2} placeholder="e.g. AI tools for research, grant writing, academic leadership..." />
        </Field>
        <Field label="Preferred mode for professional development / upskilling" required color={C.amber}>
          <CheckGroup color={C.amber} options={["Online self-paced courses", "Structured FDP workshops", "International conferences", "Peer learning / Collaborative research", "Mentoring from senior faculty", "Industry immersion / Sabbaticals", "Fellowship programmes", "Post-doctoral / advanced study"]} selected={data.career.supportNeeded} onChange={v => upd("career", "supportNeeded", v)} />
        </Field>
        <Divider color={C.amber} label="Mentoring & Leadership" />
        <Field label="Are you interested in becoming a mentor to other faculty or early-career researchers?" required color={C.amber}>
          <RadioGroup color={C.amber} options={["Yes — I already mentor others formally", "Yes — I mentor informally, open to formal role", "Interested but need structure and training", "Interested in being mentored myself first", "Not interested currently"]} value={data.career.mentoringRole} onChange={v => upd("career", "mentoringRole", v)} />
        </Field>
        <Field label="Do you aspire to an international dimension in your career?" required color={C.amber}>
          <RadioGroup color={C.amber} options={["Yes — I actively pursue international collaborations and roles", "Yes — I am open to international opportunities", "I would like to but face barriers (visa, language, funding)", "Not a priority", "No"]} value={data.career.internationalAspiration} onChange={v => upd("career", "internationalAspiration", v)} />
        </Field>
        <Field label="What are the biggest obstacles to your career progression?" required color={C.amber}>
          <CheckGroup color={C.amber} options={["Heavy teaching load", "Lack of funding", "Institutional bureaucracy", "Limited mentoring/guidance", "Personal/family commitments", "Skill gaps", "No clear pathway at institution", "Lack of recognition for research", "Lack of entrepreneurial ecosystem"]} selected={data.career.careerObstacles} onChange={v => upd("career", "careerObstacles", v)} />
        </Field>
      </>);

      if (sid === "aspirations") return (<>
        <SegmentHeader icon="★" label="Aspirations, Commitments & Final Reflections" color={C.teal}
          subtitle="This final section is your public commitment. Your responses help us close the loop between aspiration and action — and become part of the research dataset." />
        <Field label="Your single most important goal in the next 12 months" required color={C.teal}>
          <Textarea value={data.aspirations.oneYearGoal} onChange={v => upd("aspirations", "oneYearGoal", v)} rows={2} placeholder="One concrete, actionable goal — not a general aspiration" />
        </Field>
        <Field label="If you could turn one piece of research into an innovation — what would it be?" hint="Blue-sky thinking. This seed idea feeds Activity E of today's session." required color={C.teal}>
          <Textarea value={data.aspirations.innovationIdea} onChange={v => upd("aspirations", "innovationIdea", v)} rows={3} placeholder="Describe the product/service, the problem it solves, who benefits..." />
        </Field>
        <Field label="Are you open to collaboration with other FDP participants?" required color={C.teal}>
          <RadioGroup color={C.teal} options={["Yes — actively looking for collaborators", "Yes — open if the right match emerges", "Maybe — depends on the topic", "Prefer solo work for now"]} value={data.aspirations.collaborationInterest} onChange={v => upd("aspirations", "collaborationInterest", v)} />
        </Field>
        <Field label="One concrete action you commit to in the next 7 days" required hint="This becomes your public commitment — displayed (anonymously) at session close" color={C.teal}>
          <Textarea value={data.aspirations.commitmentAction} onChange={v => upd("aspirations", "commitmentAction", v)} rows={2} placeholder="e.g. I will create one infographic of my research and post it on LinkedIn..." />
        </Field>
        <Field label="Any other thoughts, suggestions, or context for the team?" color={C.teal}>
          <Textarea value={data.aspirations.additionalThoughts} onChange={v => upd("aspirations", "additionalThoughts", v)} rows={3} placeholder="Open space — share anything not captured above..." />
        </Field>
        <div style={{ background: C.emeraldLt, borderRadius: 10, padding: "16px", border: `1px solid ${C.emerald}40`, marginTop: 12 }}>
          <div style={{ fontFamily: "'DM Mono',monospace", fontSize: 10, color: C.emerald, fontWeight: 700, marginBottom: 6 }}>RESEARCH DATA NOTE</div>
          <div style={{ fontFamily: "'Lora',Georgia,serif", fontSize: 13, color: C.text2, lineHeight: 1.6 }}>
            All responses are securely stored and anonymised before analysis. Aggregate findings will be shared with all participants. This data contributes to a mixed-methods research paper on FDP effectiveness, Research-Innovation integration, and faculty career development pathways.
          </div>
        </div>
      </>);

      return <div style={{ color: C.muted, fontFamily: "'DM Mono',monospace", textAlign: "center", padding: 40 }}>Section under construction</div>;
    };

    if (submitted) return (
      <div style={{ minHeight: "100vh", background: C.ink, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'Lora',Georgia,serif" }}>
        <div style={{ textAlign: "center", color: "#fff", maxWidth: 500, padding: 40 }}>
          <div style={{ fontSize: 56, marginBottom: 20 }}>✦</div>
          <h2 style={{ fontFamily: "'Playfair Display',Georgia,serif", fontSize: 32, fontWeight: 700, marginBottom: 14 }}>Thank You</h2>
          <p style={{ fontSize: 15, color: C.muted, lineHeight: 1.7, marginBottom: 20 }}>
            Your responses are recorded. You are now a co-author of a knowledge commons of <strong style={{ color: "#fff" }}>80 faculty researchers</strong>.
          </p>
          <p style={{ fontFamily: "'DM Mono',monospace", fontSize: 11, color: C.teal, letterSpacing: 2 }}>RESEARCH DATA — CAPTURED ✓</p>

            </div>

          <button onClick={downloadPDF} style={{ marginTop: 30, padding: "12px 24px", background: C.teal, color: "#fff", border: "none", borderRadius: 8, cursor: "pointer", fontFamily: "'DM Mono',monospace", fontSize: 11, letterSpacing: 1, boxShadow: `0 4px 12px ${C.teal}40`, transition: "all 0.2s" }}>
            ↓ Download Responses (PDF)
          </button>
        </div>
      </div>

      <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column", fontFamily: "'EB Garamond',Georgia,serif" }}>

        <div className="top-bar-container">
          <div className="top-bar-inner">
            <div className="top-bar-brand">
              <img src="/static/jain logo.png" alt="Jain Logo" className="top-bar-logo" />
              <div className="top-bar-brand-text">
                <span className="top-bar-brand-name">JAIN</span>
                <span className="top-bar-brand-sub">(Deemed-to-be University)</span>
              </div>
            </div>
          </div>
        </div>

        {/* ── HERO ── */}
        <div style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", padding: "40px 24px" }}>
          <div style={{ maxWidth: 640, width: "100%", textAlign: "center" }}>

            {/* Badge */}


            {/* Title */}
            <h1 style={{
              fontFamily: "'EB Garamond',Georgia,serif",
              fontSize: "clamp(30px, 5vw, 52px)",
              fontWeight: 700, color: C.ink,
              lineHeight: 1.15, marginBottom: 20, letterSpacing: "-0.5px"
            }}>
              Faculty Research, Innovation<br />&amp; Career Pathways Survey
            </h1>

            {/* Subtitle */}
            <p style={{
              fontFamily: "'EB Garamond',Georgia,serif",
              fontSize: "clamp(15px, 1.8vw, 19px)", color: C.text2,
              lineHeight: 1.75, marginBottom: 40, maxWidth: 520, margin: "0 auto 40px"
            }}>
              A comprehensive survey to map faculty expertise, publications, AI adoption,
              innovation capacity, and career aspirations at Jain University.
            </p>

            {/* Stats row */}
            <div style={{ display: "flex", justifyContent: "center", gap: 40, marginBottom: 48, flexWrap: "wrap" }}>
              {[{ n: "10", label: "Sections" }, { n: "80+", label: "Questions" }, { n: "~45 min", label: "Duration" }].map(s => (
                <div key={s.n} style={{ textAlign: "center" }}>
                  <div style={{ fontFamily: "'EB Garamond',Georgia,serif", fontSize: 28, fontWeight: 700, color: C.teal, lineHeight: 1 }}>{s.n}</div>
                  <div style={{ fontFamily: "'DM Mono',monospace", fontSize: 9, color: C.muted, letterSpacing: 2, marginTop: 4, textTransform: "uppercase" }}>{s.label}</div>
                </div>
              ))}
            </div>

            {/* CTA Button */}
            <button onClick={() => setHasStarted(true)}

                padding: "18px 56px",

                color: "#fff", fontFamily: "'EB Garamond',Georgia,serif",
                fontSize: 20, fontWeight: 700, letterSpacing: 0.3,
                border: "none", borderRadius: 12, cursor: "pointer",
                boxShadow: `0 8px 28px ${C.teal}45`, transition: "all 0.25s",
                display: "inline-flex", alignItems: "center", gap: 12
              }}
            >

              <span style={{ fontFamily: "'DM Mono',monospace", fontSize: 16, opacity: 0.85 }}>→</span>
            </button>

            {/* Trust line */}
            <div style={{ marginTop: 24, display: "flex", justifyContent: "center", gap: 20, flexWrap: "wrap" }}>
              {["Voluntary", "Anonymised", "Academic Use Only"].map(t => (
                <span key={t} style={{
                  fontFamily: "'DM Mono',monospace", fontSize: 9, color: C.muted,
                  letterSpacing: 1, display: "flex", alignItems: "center", gap: 5
                }}>
                  <span style={{ color: C.teal }}>✓</span> {t}
                </span>
              ))}
            </div>
          </div>
        </div>
      </div>
    );


    return (
      <div style={{ minHeight: "100vh", fontFamily: "'EB Garamond',Georgia,serif" }}>

              <img src="/static/jain logo.png" alt="Jain Logo" className="top-bar-logo" />

                <span className="top-bar-brand-name">JAIN</span>
                <span className="top-bar-brand-sub">(Deemed-to-be University)</span>
              </div>
            </div>
            <div className="top-bar-text">
              <div className="top-bar-subtitle">FDP Research Survey · Research Data Point #1</div>
              <h1 className="top-bar-title">Faculty Research, Innovation & Career Pathways Survey</h1>
            </div>

                style={{
                  borderBottom: `3px solid ${i === section ? s.color : "transparent"}`,
                  cursor: i <= section ? "pointer" : "default",
                  color: i === section ? s.color : i < section ? "#6B8A9A" : "#94A3B8",
                }}>{s.icon} {s.label}</button>
            ))}
          </div>
        </div>

        {/* ── CONTENT full-width ── */}
        <div style={{ width: "100%", padding: "24px 32px 60px", boxSizing: "border-box" }}>

            padding: "clamp(24px, 3vw, 44px)",
            marginBottom: "20px",
            minHeight: "60vh"
          }}>
            {renderSection()}

          {/* ── NAV ── */}
          <div style={{
            background: "rgba(255, 255, 255, 0.95)",
            backdropFilter: "blur(12px)",

            boxShadow: "0 8px 24px rgba(0, 0, 0, 0.04)",
            display: "flex", justifyContent: "space-between", alignItems: "center",

            gap: 16, flexWrap: "wrap"
          }}>
            <button onClick={() => setSection(s => Math.max(0, s - 1))} disabled={section === 0}
              style={{
                padding: "14px 28px", border: `2px solid ${section === 0 ? C.border : C.ink}`,
                background: C.white, color: section === 0 ? C.muted : C.ink,
                fontFamily: "'DM Mono',monospace", fontSize: 13, fontWeight: 700, letterSpacing: 1,
                cursor: section === 0 ? "not-allowed" : "pointer", borderRadius: 10, transition: "all 0.2s", flexShrink: 0
              }}>
              ← PREV
            </button>
            <div style={{ fontFamily: "'DM Mono',monospace", fontSize: 12, color: C.muted, letterSpacing: 2, fontWeight: 700, textAlign: "center", flex: 1 }}>
              SECTION {section + 1} / {SECTIONS.length}
            </div>
            {section < SECTIONS.length - 1 ? (
              <button onClick={() => setSection(s => Math.min(SECTIONS.length - 1, s + 1))}
                style={{
                  padding: "14px 28px", border: "none",
                  background: `linear-gradient(135deg, ${col}, ${col}CC)`,
                  color: "#fff", fontFamily: "'DM Mono',monospace", fontSize: 13, fontWeight: 700, letterSpacing: 1,
                  cursor: "pointer", borderRadius: 10,
                  boxShadow: `0 4px 16px ${col}40`, transition: "all 0.2s", flexShrink: 0
                }}>
                NEXT →
              </button>
            ) : (
              <button onClick={handleSubmit}
                style={{
                  padding: "14px 32px", border: "none",
                  background: `linear-gradient(135deg, ${C.teal}, ${C.emerald})`,
                  color: "#fff", fontFamily: "'DM Mono',monospace", fontSize: 13, fontWeight: 700, letterSpacing: 1,
                  cursor: "pointer", borderRadius: 10,
                  boxShadow: `0 4px 16px ${C.teal}40`, flexShrink: 0
                }}>
                SUBMIT ✦
              </button>
            )}
          </div>
          <div style={{ fontFamily: "'DM Mono',monospace", fontSize: 9, color: C.muted, letterSpacing: 1, textAlign: "center", marginTop: 16 }}>
            DATA IS ANONYMISED · ACADEMIC RESEARCH USE ONLY · FDP — RESEARCH, INNOVATION & KNOWLEDGE CREATION
          </div>
        </div>
      </div>
    );
  }

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<FDPForm />);
</script>
